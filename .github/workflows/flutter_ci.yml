name: Flutter CI/CD & Automated Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Package Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flutter_application_v2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Web Application
        run: flutter build web --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safiri-holidays-apk
          path: flutter_application_v2/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Upload Web Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safiri-holidays-web
          path: flutter_application_v2/build/web/
          if-no-files-found: warn
